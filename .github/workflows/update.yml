name: Update pages

on:
  schedule:
    - cron: "5 6,16,19 * * 1-5"          # Mo-Fr: 7, 17, 20 Uhr
    - cron: "5 9,11,13,15,17,19,21 * * 0,6"  # Sa+So: 10, 12, 14, 16, 18, 20, 22 Uhr
  workflow_dispatch:                    # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Berlin                 # so "Stand" shows German local time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch data and build pages
        run: python hbnet_call.py

      - name: Commit result
        run: |
          rm -rf ausgabe/roh
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A ausgabe
          if ! git diff --staged --quiet; then
            git commit -m "Update $(date '+%d.%m.%Y %H:%M')"
            git push
          fi
