name: Update pages

on:
  schedule: 
    - cron: "5 5,6,15,16,18,19 * * 1-5"   # Mo-Fr: Kandidaten für 7, 17, 20 Uhr (Sommer- und Winterzeit)
    - cron: "5 8-21 * * 0,6"               # Sa+So: Kandidaten für 10-22 Uhr (Sommer- und Winterzeit)
  workflow_dispatch:                    # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Berlin                 # so "Stand" shows German local time
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Fetch data and build pages
        run: python hbnet_call.py

      - name: Commit result
        run: |
          rm -rf ausgabe/roh
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A ausgabe
          if ! git diff --staged --quiet; then
            git commit -m "Update $(date '+%d.%m.%Y %H:%M')"
            git push
          fi
